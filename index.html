<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pixi Battle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
    html, body { height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
