<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TIDETALE — LAST TIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{touch-action:none;overscroll-behavior:none}
html,body{margin:0;height:100%;background:#010208;overflow:hidden;font-family:sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;display:block;width:min(100vw,calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9;background:#000;touch-action:none}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;height:46vh;pointer-events:none;z-index:5}
#touch .pad,#touch .btns{position:absolute;bottom:14px;pointer-events:none}
#touch .pad{left:14px;width:150px;height:150px}
#touch .btns{right:14px;width:170px;height:150px}
#touch button{position:absolute;pointer-events:auto;width:54px;height:54px;border-radius:50%;border:2px solid rgba(160,230,255,.55);background:rgba(20,50,90,.38);color:#cfeeff;font:700 15px/1 sans-serif;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button.on{background:rgba(120,220,255,.5)}
#touch .u{left:48px;top:0}#touch .d{left:48px;top:96px}#touch .l{left:0;top:48px}#touch .r{left:96px;top:48px}
#touch .z{right:0;top:20px;width:72px;height:72px}#touch .x{right:90px;top:60px}
@media (pointer:coarse){#touch{display:block}}
#note{position:fixed;left:8px;top:6px;color:#7fb7d8;font:12px sans-serif;opacity:.0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="960" height="540"></canvas></div>
<div id="touch">
  <div class="pad"><button class="u" data-k="U">▲</button><button class="d" data-k="D">▼</button><button class="l" data-k="L">◀</button><button class="r" data-k="R">▶</button></div>
  <div class="btns"><button class="x" data-k="X">戻る<br>遅</button><button class="z" data-k="Z">決定</button></div>
</div>
<script>
'use strict';
/* ============================================================
   TIDETALE — LAST TIDE   (unofficial Undertale fan AU / Sans fight)
   All graphics, music and text are original. Single file, no assets.
   ============================================================ */
const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SC = Math.min(2, Math.max(1, Math.ceil(window.devicePixelRatio || 1)));
cv.width = W * SC; cv.height = H * SC;
const FONT = '"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",sans-serif';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const E = {
  lin: t => t, in: t => t * t, out: t => 1 - (1 - t) * (1 - t),
  outc: t => 1 - Math.pow(1 - t, 3), io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  ios: t => -(Math.cos(Math.PI * t) - 1) / 2,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outq: t => 1 - Math.pow(1 - t, 5)
};

/* ---------- input ---------- */
const K = {}, KP = {};
const KEYMAP = {
  ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', ArrowUp: 'U', KeyW: 'U', ArrowDown: 'D', KeyS: 'D',
  KeyZ: 'OK', Enter: 'OK', Space: 'OK', KeyX: 'NO', Escape: 'NO', ShiftLeft: 'SLOW', ShiftRight: 'SLOW', KeyC: 'SLOW'
};
function setKey(a, down) { if (down && !K[a]) KP[a] = true; K[a] = down; }
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (a) { setKey(a, true); e.preventDefault(); } if (e.code === 'KeyM') Snd.toggle(); else Snd.init(); });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { setKey(a, false); e.preventDefault(); } });
addEventListener('blur', () => { for (const k in K) K[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); if (k === 'Z') setKey('OK', true); else if (k === 'X') { setKey('NO', true); setKey('SLOW', true); } else setKey(k, true); Snd.init(); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); if (k === 'Z') setKey('OK', false); else if (k === 'X') { setKey('NO', false); setKey('SLOW', false); } else setKey(k, false); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
cv.addEventListener('pointerdown', () => { Snd.init(); });
// no long-press selection / copy callout / context menu / double-tap zoom anywhere in the game
for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'gesturestart']) document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('touchstart', e => { if (e.target.closest && (e.target.closest('#touch') || e.target === cv)) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { if (e.target.closest && e.target.closest('#touch')) e.preventDefault(); }, { passive: false });
let I = {};
function readInput() {
  const bot = window.__bot;
  if (bot) { I = bot(); }
  else I = { l: K.L, r: K.R, u: K.U, d: K.D, slow: K.SLOW, ok: KP.OK, no: KP.NO, pl: KP.L, pr: KP.R, pu: KP.U, pd: KP.D };
  if (window.__press) { for (const k in window.__press) { if (k === 'OK') I.ok = true; if (k === 'NO') I.no = true; if (k === 'L') I.pl = true; if (k === 'R') I.pr = true; if (k === 'U') I.pu = true; if (k === 'D') I.pd = true; } window.__press = null; }
}
function clearEdges() { for (const k in KP) KP[k] = false; }

/* ---------- audio : fully procedural ---------- */
const Snd = (() => {
  let ac = null, master, revIn, dlyIn, dry, nbuf, muted = false, level = 0, step = 0, nextT = 0, timer = null;
  let bpm = 120, running = false, prog = 0;
  const PROGS = [
    [[50, 57, 62, 65], [46, 53, 58, 62], [53, 57, 60, 65], [48, 55, 60, 64]],
    [[50, 57, 62, 65], [46, 53, 58, 62], [43, 55, 58, 62], [45, 57, 61, 64]]
  ];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function impulse(len, decay) {
    const n = ac.sampleRate * len | 0, b = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; return; }
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = muted ? 0 : .8; master.connect(comp); comp.connect(ac.destination);
    dry = ac.createGain(); dry.connect(master);
    const conv = ac.createConvolver(); conv.buffer = impulse(3.2, 2.4);
    const rg = ac.createGain(); rg.gain.value = .55; conv.connect(rg); rg.connect(master);
    revIn = ac.createGain(); revIn.connect(conv);
    const dl = ac.createDelay(1); dl.delayTime.value = 60 / bpm * .75;
    const fb = ac.createGain(); fb.gain.value = .36; const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    dlyIn = ac.createGain(); dlyIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master); lp.connect(revIn);
    nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const nd = nbuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function wire(n, rev, dly) {
    n.connect(dry);
    if (rev) { const g = ac.createGain(); g.gain.value = rev; n.connect(g); g.connect(revIn); }
    if (dly) { const g = ac.createGain(); g.gain.value = dly; n.connect(g); g.connect(dlyIn); }
  }
  function tone(f, t, dur, o = {}) {
    if (!ac) return;
    const { type = 'sine', vol = .15, a = .006, r = .12, det = 0, lp = 0, rev = .25, dly = .12, slide = 0 } = o;
    const os = ac.createOscillator(); os.type = type; os.frequency.setValueAtTime(f, t);
    if (slide) os.frequency.exponentialRampToValueAtTime(Math.max(18, f * slide), t + dur);
    os.detune.value = det;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur + r);
    let n = os;
    if (lp) { const f2 = ac.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = lp; os.connect(f2); n = f2; }
    n.connect(g); wire(g, rev, dly); os.start(t); os.stop(t + dur + r + .05);
  }
  function noise(t, dur, o = {}) {
    if (!ac) return;
    const { vol = .1, hp = 0, lp = 0, rev = .15, a = .003, slide = 0 } = o;
    const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let n = s;
    if (hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; n.connect(f); n = f; }
    if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(lp, t); if (slide) f.frequency.exponentialRampToValueAtTime(Math.max(80, lp * slide), t + dur); n.connect(f); n = f; }
    n.connect(g); wire(g, rev, 0); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  }
  const now = () => ac ? ac.currentTime + .005 : 0;
  function playStep(s, t) {
    const L = level, bar = ((s / 16) | 0) % 4, ch = PROGS[prog][bar], sp = s % 16, beat = 60 / bpm;
    if (sp === 0) {
      for (let i = 0; i < 4; i++) { tone(mtof(ch[i]), t, beat * 4, { type: 'sawtooth', vol: .028 + (L > 2 ? .01 : 0), a: .5, r: 1.6, det: (i % 2 ? 7 : -7), lp: 700 + L * 160, rev: .6, dly: .1 }); }
    }
    const pool = [ch[1], ch[2], ch[3], ch[1] + 12, ch[2] + 12, ch[3] + 12, ch[0] + 24];
    const AP = [0, 2, 4, 2, 1, 3, 5, 3, 0, 2, 4, 5, 4, 2, 1, 3];
    const arpOn = L === 0 ? sp % 4 === 0 : L === 1 ? sp % 2 === 0 : true;
    if (arpOn) tone(mtof(pool[AP[sp] % pool.length] + 12), t, .12, { type: 'triangle', vol: L === 0 ? .05 : .07 + (sp % 4 === 0 ? .025 : 0), r: .35, rev: .45, dly: .35 });
    if (L >= 1 && sp % 8 === 0) tone(mtof(ch[0] - 12), t, beat * 1.6, { type: 'sine', vol: .2, a: .01, r: .3, rev: .05, dly: 0 });
    if (L >= 2 && (sp === 6 || sp === 14 || sp === 10)) tone(mtof(ch[0] - 12), t, .2, { type: 'sine', vol: .12, rev: .05, dly: 0 });
    if (L >= 2) {
      if (sp % 2 === 0) noise(t, .035, { vol: sp % 4 === 2 ? .05 : .03, hp: 7000, rev: .05 });
      if (sp === 0 || sp === 8 || (L >= 3 && (sp === 10 || (L >= 4 && sp === 6)))) tone(120, t, .13, { type: 'sine', vol: .5, slide: .25, a: .002, r: .05, rev: 0, dly: 0 });
    }
    if (L >= 3 && (sp === 4 || sp === 12)) { noise(t, .16, { vol: .12, hp: 1500, rev: .3 }); tone(210, t, .08, { type: 'triangle', vol: .1, slide: .5, rev: .2 }); }
    if (L >= 4 && sp % 2 === 0) {
      const lead = [pool[5], pool[4], pool[2], pool[4], pool[5], pool[3], pool[2], pool[1]][(sp / 2) | 0];
      tone(mtof(lead + 12), t, .22, { type: 'sine', vol: .08, a: .01, r: .5, rev: .55, dly: .4, det: 4 });
    }
  }
  function sched() {
    if (!ac || !running) return;
    while (nextT < ac.currentTime + .16) { playStep(step, nextT); nextT += 60 / bpm / 4; step++; }
  }
  return {
    init,
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : .8; },
    start(l, p) { init(); if (!ac) return; if (p !== undefined) prog = p; level = l; if (!running) { running = true; step = 0; nextT = ac.currentTime + .08; timer = setInterval(sched, 25); } },
    restart(l, p) { if (!ac) return; level = l; if (p !== undefined) prog = p; step = 0; nextT = ac.currentTime + .06; running = true; if (!timer) timer = setInterval(sched, 25); },
    level(l) { level = l; },
    stop() { running = false; clearInterval(timer); timer = null; },
    blip(f = 150) { if (ac) tone(f, now(), .05, { type: 'square', vol: .05, a: .002, r: .02, rev: 0, dly: 0 }); },
    move() { if (ac) tone(620, now(), .03, { type: 'square', vol: .035, rev: 0, dly: 0 }); },
    sel() { if (ac) { const t = now(); tone(880, t, .05, { type: 'triangle', vol: .12 }); tone(1320, t + .05, .08, { type: 'triangle', vol: .1 }); } },
    back() { if (ac) tone(420, now(), .06, { type: 'triangle', vol: .1 }); },
    hit() { if (ac) { const t = now(); noise(t, .22, { vol: .35, lp: 3000, slide: .1 }); tone(160, t, .2, { type: 'sawtooth', vol: .2, slide: .3, lp: 900 }); } },
    charge(d = .6) { if (ac) { const t = now(); tone(140, t, d, { type: 'sawtooth', vol: .07, slide: 8, lp: 2400, a: d * .8, r: .02, rev: .4 }); noise(t, d, { vol: .05, hp: 3000, a: d * .9 }); } },
    fire(big = 1) { if (ac) { const t = now(); noise(t, .55 * big, { vol: .3, lp: 5000, slide: .08, rev: .5 }); tone(98, t, .5, { type: 'sawtooth', vol: .16, slide: .5, lp: 1000 }); tone(392, t, .6, { type: 'sine', vol: .12, slide: .5, rev: .6 }); tone(784, t, .8, { type: 'triangle', vol: .06, slide: .7, rev: .6 }); } },
    heal() { if (ac) { const t = now(); [0, 4, 7, 12].forEach((n, i) => tone(mtof(72 + n), t + i * .06, .1, { type: 'triangle', vol: .12 })); } },
    slash() { if (ac) { const t = now(); noise(t, .2, { vol: .25, hp: 1800, rev: .3 }); tone(900, t, .2, { type: 'sawtooth', vol: .08, slide: .2 }); } },
    miss() { if (ac) { const t = now(); noise(t, .18, { vol: .1, hp: 800, lp: 4000, rev: .2 }); } },
    shatter() { if (ac) { const t = now(); noise(t, .6, { vol: .3, hp: 1000, rev: .6 }); [0, 3, 7, 12, 15].forEach((n, i) => tone(mtof(84 - n), t + i * .05, .3, { type: 'triangle', vol: .1, rev: .7 })); } },
    warn() { if (ac) { const t = now(); tone(660, t, .08, { type: 'square', vol: .06, rev: 0 }); tone(660, t + .12, .08, { type: 'square', vol: .06, rev: 0 }); } },
    chime(n = 0) { if (ac) tone(mtof(76 + n), now(), .3, { type: 'sine', vol: .12, r: .8, rev: .7, dly: .4 }); }
  };
})();

/* ============================================================
   PIXEL SPRITE KIT
   Every design is drawn dot by dot into a small bitmap. On screen each dot is
   P x P world pixels, but sprites are placed, moved and rotated on the smooth
   960x540 world grid (no screen-grid snapping, no blur, no glow haze).
   ============================================================ */
const P = 4;
let TB = null, TW = 0, TH = 0;                 // current bitmap being painted
function setTarget(b, w, h) { TB = b; TW = w; TH = h; }
function hex(s) { const n = parseInt(s.slice(1), 16); return ((255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255)) >>> 0; }
const packRGB = (r, g, b) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
const css = c => '#' + [c & 255, (c >> 8) & 255, (c >> 16) & 255].map(v => v.toString(16).padStart(2, '0')).join('');

function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= TW || y >= TH) return; TB[y * TW + x] = c; }
function rectF(x, y, w, h, c) { for (let j = Math.round(y); j < Math.round(y + h); j++) for (let i = Math.round(x); i < Math.round(x + w); i++) px(i, j, c); }
function lineP(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  for (let n = 0; n < 500; n++) { px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function ellF(cx, cy, rx, ry, c) {
  for (let j = Math.floor(cy - ry - 1); j <= Math.ceil(cy + ry + 1); j++) for (let i = Math.floor(cx - rx - 1); i <= Math.ceil(cx + rx + 1); i++) {
    const u = (i + .5 - cx - .5) / (rx + .35), v = (j + .5 - cy - .5) / (ry + .35); if (u * u + v * v <= 1) px(i, j, c);
  }
}
const discF = (cx, cy, r, c) => ellF(cx, cy, r, r, c);
function capsuleF(x0, y0, x1, y1, r, c) {
  const dx = x1 - x0, dy = y1 - y0, l2 = dx * dx + dy * dy;
  for (let j = Math.floor(Math.min(y0, y1) - r - 1); j <= Math.ceil(Math.max(y0, y1) + r + 1); j++) for (let i = Math.floor(Math.min(x0, x1) - r - 1); i <= Math.ceil(Math.max(x0, x1) + r + 1); i++) {
    let t = l2 ? ((i - x0) * dx + (j - y0) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = x0 + dx * t - i, ey = y0 + dy * t - j; if (ex * ex + ey * ey <= r * r + .25) px(i, j, c);
  }
}
function polyF(p, c) {
  let minY = 1e9, maxY = -1e9; const n = p.length / 2;
  for (let i = 0; i < n; i++) { minY = Math.min(minY, p[i * 2 + 1]); maxY = Math.max(maxY, p[i * 2 + 1]); }
  for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
    const xs = [], yy = y + .5;
    for (let i = 0; i < n; i++) { const j = (i + 1) % n, ax = p[i * 2], ay = p[i * 2 + 1], bx = p[j * 2], by = p[j * 2 + 1]; if ((ay <= yy && by > yy) || (by <= yy && ay > yy)) xs.push(ax + (yy - ay) / (by - ay) * (bx - ax)); }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) px(x, y, c);
  }
}

/* ---------- sprite objects ---------- */
function mkSpr(w, h) { return { w, h, d: new Uint32Array(w * h) }; }
function paint(w, h, fn) { const s = mkSpr(w, h); setTarget(s.d, w, h); fn(); return s; }
function sprFromRows(rows, map) {
  const s = mkSpr(rows[0].length, rows.length);
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const ch = r[x]; if (ch !== '.' && ch !== ' ') s.d[y * s.w + x] = map[ch] || 0; } });
  return s;
}
function outlineSpr(s, col) {
  const o = mkSpr(s.w + 2, s.h + 2);
  for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) if (s.d[j * s.w + i]) o.d[(j + 1) * o.w + i + 1] = s.d[j * s.w + i];
  const src = o.d.slice();
  for (let j = 0; j < o.h; j++) for (let i = 0; i < o.w; i++) {
    if (src[j * o.w + i]) continue;
    if ((i > 0 && src[j * o.w + i - 1]) || (i < o.w - 1 && src[j * o.w + i + 1]) || (j > 0 && src[(j - 1) * o.w + i]) || (j < o.h - 1 && src[(j + 1) * o.w + i])) o.d[j * o.w + i] = col;
  }
  return o;
}
function flipV(s) { const o = mkSpr(s.w, s.h); for (let j = 0; j < s.h; j++) for (let i = 0; i < s.w; i++) o.d[j * s.w + i] = s.d[(s.h - 1 - j) * s.w + i]; return o; }
function sprCanvas(s) {
  if (s.cv) return s.cv;
  const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
  const g = c.getContext('2d'), im = g.createImageData(s.w, s.h); new Uint32Array(im.data.buffer).set(s.d); g.putImageData(im, 0, 0);
  return s.cv = c;
}

/* ---------- palette ---------- */
const PL = {
  ink: hex('#070a1c'), ink2: hex('#0d1432'), white: hex('#ffffff'), yellow: hex('#ffe566'), red: hex('#ff2a4a'), red2: hex('#b0102c'), blue: hex('#2a7bff'), blue2: hex('#1240a8'),

function update() {
  readInput();
  G.t++;
  if (G.wait) { if (--G.wait.n <= 0) { const cb = G.wait.cb; G.wait = null; cb(); } }
  updTw(); updParts();
  cam.shake *= .86; world.flash *= .9; world.red *= .92; if (G.inv > 0) G.inv--;
  if (mini.d > 0) { mini.t++; if (mini.t > mini.d) mini.d = 0; }
  SN.hist.push(SN.dx); if (SN.hist.length > 12) SN.hist.shift();
  const sc = G.scene;
  if (sc === 'title') {
    if (I.pl) { G.diff = (G.diff + 2) % 3; Snd.move(); } if (I.pr) { G.diff = (G.diff + 1) % 3; Snd.move(); }
    if (I.ok) { Snd.init(); Snd.sel(); startGame(); }
  } else if (sc === 'talk') dlgUpdate();
  else if (sc === 'menu') updMenu();
  else if (sc === 'attack') { updBullets(); updBlasters(); updAttack(); if (A && well.on && A.f > 0 && !A.ending && Math.hypot(soul.wx - well.x, soul.wy - well.y) < 13) hurt(8); }
  else if (sc === 'dead') { G.dead++; if (G.dead > 110 && I.ok) retry(); }
  else if (sc === 'end') { G.endCard.t++; if (G.endCard.t > 200 && I.ok) { Snd.stop(); newGame(); G.scene = 'title'; SN.x = 760; SN.flame = .9; SN.mood = 'closed'; world.fade = 0; world.dawn = 0; } }
  clearEdges();
}
function retry() {
  const k = G.curAtk, line = STORY.retry[Math.min(G.deaths - 1, 2)];
  G.hp = G.maxhp; G.scene = 'talk'; G.inv = 0; world.flash = 0;
  Snd.start(0, 0); Snd.level(0);
  runSeq([sSans(line), sFn(() => startAttack(k, G.atkDone))]);
}
function updMenu() {
  if (Dlg.on) { dlgUpdate(); return; }
  G.fn += .8;
  const s = G.sub;
  if (s === 'main') {
    if (I.pl) { G.sel = (G.sel + 3) % 4; Snd.move(); G.fn = 0; }
    if (I.pr) { G.sel = (G.sel + 1) % 4; Snd.move(); G.fn = 0; }
    if (I.ok) {
      Snd.sel();
      if (G.sel === 0) startFight();
      else if (G.sel === 1) { G.sub = 'act'; G.idx = 0; }
      else if (G.sel === 2) { if (G.items.length) { G.sub = 'item'; G.idx = 0; } else G.fn = -999; }
      else { G.sub = 'mercy'; G.idx = 0; }
    }
  } else if (s === 'act' || s === 'item' || s === 'mercy') {
    const n = s === 'act' ? 3 : s === 'item' ? G.items.length : 2;
    if (I.pu) { G.idx = (G.idx + n - 1) % n; Snd.move(); }
    if (I.pd) { G.idx = (G.idx + 1) % n; Snd.move(); }
    if (I.no) { G.sub = 'main'; Snd.back(); }
    if (I.ok) { Snd.sel(); if (s === 'act') [doCheck, doRead, doTalk][G.idx](); else if (s === 'item') doItem(G.idx); else doMercy(G.idx); }
  } else if (s === 'fightbar') {
    const b = G.bar; b.t++;
    if (b.state === 'run') {
      b.x += 7.2;
      if (I.ok) { b.state = 'stop'; b.acc = 1 - Math.abs(b.x - 330) / 330; b.t = 0; Snd.slash(); }
      else if (b.x >= 660) { b.state = 'stop'; b.acc = 0; b.t = 0; b.late = true; }
    } else if (b.state === 'stop') {
      if (b.t === 2 && G.turn < 6) { tw(SN, { dx: 160 }, 7, 'outc'); Snd.miss(); }
      if (b.t === 52 && G.turn < 6) tw(SN, { dx: 0 }, 22);
      if (b.t === 70) fightResult();
    }
  }
}
